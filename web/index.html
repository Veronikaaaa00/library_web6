<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Каталог библиотеки">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Библиотека">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Библиотека</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #faf6f8;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: #5b1040;
      z-index: 9999;
      transition: opacity .35s ease;
    }
    #loading.fade {
      opacity: 0;
      pointer-events: none;
    }
    #loading .brand {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: .02em;
    }
    #loading .hint {
      font-size: .95rem;
      opacity: .7;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(233, 30, 140, .2);
      border-top-color: #e91e8c;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading" aria-live="polite" aria-busy="true">
    <div class="brand">Библиотека</div>
    <div class="spinner" role="progressbar" aria-label="Загрузка"></div>
    <div class="hint">Загрузка приложения…</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('fade');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
